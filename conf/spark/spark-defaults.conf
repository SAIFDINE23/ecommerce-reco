# Configuration Spark partagée par tous les conteneurs (SPARK_CONF_DIR).

# Tous les horodatages du dataset sont en UTC : on évite toute conversion implicite.
spark.sql.session.timeZone                 UTC

# Réécrire une partition (une date) sans effacer les autres : rend l'ingestion
# idempotente et incrémentale (Airflow pourra relancer une journée sans risque).
spark.sql.sources.partitionOverwriteMode   dynamic

# Adapté à un laptop : 200 partitions par défaut, c'est trop pour quelques cœurs.
spark.sql.shuffle.partitions               48
spark.sql.adaptive.enabled                 true

spark.serializer                           org.apache.spark.serializer.KryoSerializer