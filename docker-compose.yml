# Cluster Spark (1 master + 1 worker) + un conteneur client (Jupyter / spark-submit)
# + un serveur MLflow (suivi des entraînements) + un broker Kafka (flux de clics temps réel)
# + Redis (fiches de session en mémoire, lues en quelques millisecondes)
# + Airflow (chef d'orchestre : lance les jobs Spark à l'heure prévue, dans le bon ordre).
# L'API sera ajoutée dans une étape suivante.
# Les tailles mémoire/CPU viennent du fichier .env (voir .env.example).

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  image: ecommerce-reco/spark:3.5.3
  volumes:
    # Le projet est monté au même chemin dans TOUS les conteneurs :
    # driver et executors lisent/écrivent les mêmes fichiers (data/raw, data/lake...).
    - ./:/opt/project
  networks: [reco]

services:
  spark-master:
    <<: *spark-common
    container_name: spark-master
    hostname: spark-master
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8090:8080"   # UI du master : http://localhost:8090 (8080 sera pris par Airflow)
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    hostname: spark-worker
    command: >
      spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
      --cores ${SPARK_WORKER_CORES:-2} --memory ${SPARK_WORKER_MEMORY:-3g} --webui-port 8081
    ports:
      - "8081:8081"   # UI du worker : http://localhost:8081
    depends_on:
      spark-master:
        condition: service_healthy

  spark-client:
    <<: *spark-common
    container_name: spark-client
    hostname: spark-client
    environment:
      MASTER: spark://spark-master:7077            # lu par spark-submit
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-2g}
      MLFLOW_TRACKING_URI: http://mlflow:5000       # lu automatiquement par la librairie mlflow
    # JupyterLab pour explorer ; c'est aussi depuis ce conteneur qu'on lance spark-submit
    # (le "driver" du job tourne ici, les calculs tournent sur le worker).
    command: >
      jupyter lab --ip 0.0.0.0 --port 8888 --no-browser --allow-root
      --ServerApp.token='' --ServerApp.root_dir=/opt/project
    ports:
      - "8888:8888"   # JupyterLab : http://localhost:8888
      - "4040:4040"   # UI du job Spark en cours : http://localhost:4040
    depends_on:
      spark-master:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  mlflow:
    build:
      context: docker/mlflow
    image: ecommerce-reco/mlflow:3.16.1
    container_name: mlflow
    hostname: mlflow
    # --backend-store-uri      : petite base SQLite pour les paramètres et les métriques
    # --artifacts-destination  : dossier où sont rangés les fichiers (modèles, rapports)
    # --allowed-hosts          : noms autorisés pour joindre le serveur (sécurité) :
    #                            "mlflow:5000" depuis les conteneurs, "localhost:5000" depuis Windows
    # --workers 1              : un seul processus, pour économiser la RAM
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    volumes:
      - ./data/mlflow:/mlflow   # la base et les artifacts survivent aux redémarrages (ignoré par git)
    ports:
      - "5000:5000"   # UI MLflow : http://localhost:5000
    networks: [reco]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    # Mode KRaft : un seul conteneur joue à la fois le rôle de "broker" (stocke les messages)
    # et de "controller" (gère le cluster). Plus besoin de ZooKeeper.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092     # l'adresse donnée aux clients (réseau Docker)
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Un seul broker : chaque donnée interne n'a qu'une copie (en production : 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3                   # partitions par défaut d'un nouveau topic
      KAFKA_LOG_RETENTION_HOURS: 168            # on garde les messages 7 jours
      KAFKA_HEAP_OPTS: -Xmx512m                 # 512 Mo max : suffisant ici, et la RAM de WSL est comptée
    # Pas de volume : les messages survivent à un "stop/start", mais pas à un "down".
    # Pas grave ici : on peut toujours rejouer novembre depuis le data lake.
    networks: [reco]
    healthcheck:
      # Petit outil Kafka qui interroge le broker (lancé avec peu de mémoire pour ne pas gêner).
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: redis
    hostname: redis
    # --save "" --appendonly no : pas de sauvegarde sur disque. Tout ce que Redis contient se
    #   reconstruit (sessions en direct depuis Kafka, candidats recalculés chaque nuit).
    # --maxmemory 512mb + volatile-lru : au-delà de 512 Mo, Redis supprime les fiches
    #   les moins récemment utilisées plutôt que de planter.
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy volatile-lru
    networks: [reco]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:3.1.8-python3.11
    container_name: airflow
    hostname: airflow
    # "standalone" = toutes les pièces d'Airflow dans UN conteneur (interface, planificateur,
    # exécution des tâches) + base SQLite. Parfait pour un projet sur un seul PC.
    command: standalone
    # root UNIQUEMENT pour pouvoir utiliser le socket Docker (piloter spark-client).
    # Acceptable en local, jamais en production.
    user: "0:0"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"                  # pas les 50 DAGs d'exemple
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"    # nos DAGs sont actifs dès leur apparition
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"  # pas de mot de passe (local uniquement)
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/state/logs
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./airflow/dags:/opt/airflow/dags                     # nos DAGs (modifiables à chaud)
      - ./data/airflow:/opt/airflow/state                    # base + journaux : survivent au redémarrage
      - /var/run/docker.sock:/var/run/docker.sock            # la "télécommande" Docker
    ports:
      - "8080:8080"   # interface Airflow : http://localhost:8080
    networks: [reco]
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

networks:
  reco:
    name: reco