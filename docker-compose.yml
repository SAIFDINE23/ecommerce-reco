# Cluster Spark (1 master + 1 worker) + un conteneur client (Jupyter / spark-submit)
# + un serveur MLflow (suivi des entraînements).
# Kafka, Airflow, Redis et l'API seront ajoutés dans les étapes suivantes.
# Les tailles mémoire/CPU viennent du fichier .env (voir .env.example).

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  image: ecommerce-reco/spark:3.5.3
  volumes:
    # Le projet est monté au même chemin dans TOUS les conteneurs :
    # driver et executors lisent/écrivent les mêmes fichiers (data/raw, data/lake...).
    - ./:/opt/project
  networks: [reco]

services:
  spark-master:
    <<: *spark-common
    container_name: spark-master
    hostname: spark-master
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8090:8080"   # UI du master : http://localhost:8090 (8080 sera pris par Airflow)
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    hostname: spark-worker
    command: >
      spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
      --cores ${SPARK_WORKER_CORES:-2} --memory ${SPARK_WORKER_MEMORY:-3g} --webui-port 8081
    ports:
      - "8081:8081"   # UI du worker : http://localhost:8081
    depends_on:
      spark-master:
        condition: service_healthy

  spark-client:
    <<: *spark-common
    container_name: spark-client
    hostname: spark-client
    environment:
      MASTER: spark://spark-master:7077            # lu par spark-submit
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-2g}
      MLFLOW_TRACKING_URI: http://mlflow:5000       # lu automatiquement par la librairie mlflow
    # JupyterLab pour explorer ; c'est aussi depuis ce conteneur qu'on lance spark-submit
    # (le "driver" du job tourne ici, les calculs tournent sur le worker).
    command: >
      jupyter lab --ip 0.0.0.0 --port 8888 --no-browser --allow-root
      --ServerApp.token='' --ServerApp.root_dir=/opt/project
    ports:
      - "8888:8888"   # JupyterLab : http://localhost:8888
      - "4040:4040"   # UI du job Spark en cours : http://localhost:4040
    depends_on:
      spark-master:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  mlflow:
    build:
      context: docker/mlflow
    image: ecommerce-reco/mlflow:3.16.1
    container_name: mlflow
    hostname: mlflow
    # --backend-store-uri      : petite base SQLite pour les paramètres et les métriques
    # --artifacts-destination  : dossier où sont rangés les fichiers (modèles, rapports)
    # --allowed-hosts          : noms autorisés pour joindre le serveur (sécurité) :
    #                            "mlflow:5000" depuis les conteneurs, "localhost:5000" depuis Windows
    # --workers 1              : un seul processus, pour économiser la RAM
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    volumes:
      - ./data/mlflow:/mlflow   # la base et les artifacts survivent aux redémarrages (ignoré par git)
    ports:
      - "5000:5000"   # UI MLflow : http://localhost:5000
    networks: [reco]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  reco:
    name: reco